[project]
name = "bht-etl"
version = "0.1.0"
description = "Blue Horizon Trade S.A.C. — Neon Postgres ERP Core, ETL & Analytics Pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
bht-etl = "bht_etl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bht_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
