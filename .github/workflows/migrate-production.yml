name: Apply approved production migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Escribe APLICAR-019-EN-MAIN para aplicar migraciones pendientes en Neon main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-main-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'APLICAR-019-EN-MAIN'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.NEON_MAIN_DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Check migration range and credentials
        shell: bash
        run: |
          test -n "$DATABASE_URL_UNPOOLED"
          test -f db/migrations/019_daily_closure_correction_audit.sql
          test ! -f db/migrations/020_*.sql
      - name: Apply versioned migrations to Neon main
        run: uv run bht-etl migrate --branch main
      - name: Confirm required schema version
        run: |
          uv run python -c "from bht_etl.db import get_connection; c=get_connection('main'); r=c.execute(\"SELECT EXISTS (SELECT 1 FROM public.schema_migrations WHERE version = '019_daily_closure_correction_audit')\").fetchone()[0]; c.close(); assert r, 'Migration 019 missing'"
